<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>De Tandarts Dongen | Binnenkort online</title>
<meta name="description" content="De Tandarts Dongen: persoonlijke tandheelkundige zorg voor het hele gezin. Onze website is binnenkort online.">
<style>
  :root { --paars:#564960; --donker:#3C3343; --licht:#F6F3F7; --wit:#fff; }
  * { box-sizing:border-box; margin:0; }
  body {
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:24px; text-align:center; color:var(--wit);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    background:linear-gradient(160deg,var(--paars),var(--donker));
  }
  main { max-width:560px; }
  .merk { letter-spacing:.18em; font-weight:700; font-size:clamp(28px,6vw,40px); }
  .lijn { width:64px; height:3px; background:var(--wit); opacity:.8; margin:14px auto; border-radius:2px; }
  .plaats { letter-spacing:.3em; text-transform:uppercase; font-size:clamp(14px,3vw,18px); opacity:.9; }
  h1 { font-size:clamp(24px,5vw,34px); font-weight:600; margin:48px 0 12px; }
  p { font-size:18px; line-height:1.6; opacity:.92; }
  .knoppen { display:flex; flex-wrap:wrap; gap:12px; justify-content:center; margin-top:28px; }
  a.knop {
    display:inline-block; padding:14px 24px; border-radius:999px;
    background:var(--wit); color:var(--donker); text-decoration:none; font-weight:600;
  }
  a.knop:hover, a.knop:focus-visible { background:var(--licht); }
  footer { margin-top:32px; font-size:15px; }
  footer a { color:inherit; margin:0 8px; opacity:.85; }
</style>
</head>
<body>
<main>
  <div class="merk">DE TANDARTS</div>
  <div class="lijn"></div>
  <div class="plaats">Dongen</div>
  <h1>Onze website is binnenkort online</h1>
  <p>Persoonlijke zorg, goede preventie en moderne behandelingen voor het hele gezin. Tot die tijd kunt u ons bereiken via telefoon of e-mail.</p>
  <div class="knoppen">
    <a class="knop" href="tel:+31162319626">0162 319 626</a>
    <a class="knop" href="mailto:info@tandartsdongen.nl">info@tandartsdongen.nl</a>
  </div>
  <footer>
    <a href="https://www.facebook.com/profile.php?id=61596198985809">Facebook</a>
    <a href="https://www.instagram.com/detandartsdongen">Instagram</a>
  </footer>
</main>
</body>
</html>
